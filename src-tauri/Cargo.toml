[package]
name = "daymark"
version = "0.1.0"
description = "Daymark (日迹) — local-first daily planner and report generator"
authors = ["Chenghao Li"]
edition = "2024"

[lib]
name = "daymark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebDAV needs methods (PROPFIND, MOVE) and Basic auth that a WebView fetch
# cannot send because of CORS. Requests live in Rust; the UI only calls the
# `webdav_request` command.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
